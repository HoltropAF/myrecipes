<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>myrecipes · Mobile preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#eae5dc;color:#594e42;font:13px system-ui,sans-serif}.preview-bar{display:flex;align-items:center;justify-content:center;gap:12px;padding:14px 16px;flex-wrap:wrap}.preview-bar span{font-size:11px;color:#786d60}.preview-bar select{padding:7px;border:1px solid #cfc4b4;border-radius:6px;background:#fffaf2;color:#594e42}iframe{display:block;width:min(390px,100%);height:844px;max-height:calc(100dvh - 78px);margin:0 auto 20px;border:1px solid #c7bbaa;border-radius:22px;background:#fdf8f0;box-shadow:0 14px 45px #4f37201c}@media(max-width:420px){.preview-bar{padding:8px}iframe{border-radius:0;border:0;max-height:calc(100dvh - 58px);margin-bottom:0}}
