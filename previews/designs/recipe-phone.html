<div id="recipe-phone" class="viz-carousel viz-dotted-background" aria-label="Phone recipe app designs">
  <section data-variant="The cookbook" aria-label="Phone cookbook"><div class="ph-stage"><div class="ph-app" data-mode="cards"></div></div></section>
  <section data-variant="The pocket notebook" aria-label="Phone pocket notebook" hidden><div class="ph-stage"><div class="ph-app" data-mode="list"></div></div></section>
</div>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display:ital@0;1&display=swap');
#recipe-phone .ph-stage{min-height:850px;padding:22px 8px;display:flex;justify-content:center;align-items:flex-start}#recipe-phone .ph-app{--p-paper:light-dark(#faf5ed,#28251f);--p-card:light-dark(#fffcf6,#322e27);--p-ink:light-dark(#39332b,#f1e7d7);--p-muted:light-dark(#7e7365,#bbaf9e);--p-line:light-dark(#e6dccc,#494135);--p-tomato:light-dark(#aa4636,#e7a08a);--p-on:light-dark(#fff9ed,#2d211b);--p-sage:light-dark(#e8ecdd,#394231);--p-green:light-dark(#536047,#d0daba);width:390px;max-width:100%;background:var(--p-paper);color:var(--p-ink);font:14px/1.5 'DM Sans',sans-serif;border:1px solid var(--p-line);border-radius:28px;overflow:hidden;position:relative;box-shadow:0 18px 50px light-dark(#5e452415,#00000025)}#recipe-phone *{box-sizing:border-box}#recipe-phone [hidden]{display:none!important}#recipe-phone button,#recipe-phone input,#recipe-phone textarea{font:inherit}#recipe-phone button{cursor:pointer;color:inherit}#recipe-phone button:focus-visible{outline:3px solid var(--p-tomato);outline-offset:2px}#recipe-phone .ph-top{padding:22px 22px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--p-line)}#recipe-phone .ph-brand{font:26px 'DM Serif Display',Georgia,serif;letter-spacing:-.5px}#recipe-phone .ph-brand span{color:var(--p-tomato)}#recipe-phone .ph-icon{border:1px solid var(--p-line);background:var(--p-card);width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--p-tomato)}#recipe-phone .ph-icon svg{width:19px;height:19px}#recipe-phone .ph-main{padding:23px 20px 16px;min-height:606px}#recipe-phone h1{font:32px/1.13 'DM Serif Display',Georgia,serif;margin:7px 0 10px;letter-spacing:-.5px}#recipe-phone p{margin:0;color:var(--p-muted)}#recipe-phone .ph-kicker{font-size:9px;letter-spacing:1.5px;color:var(--p-tomato)}#recipe-phone .ph-sub{font-size:12px}#recipe-phone .ph-tabs{display:flex;gap:8px;margin:22px 0 18px}#recipe-phone .ph-tabs button{border:1px solid var(--p-line);background:var(--p-card);border-radius:20px;padding:11px 13px;font-size:11px;min-height:44px}#recipe-phone .ph-tabs button[aria-pressed="true"]{background:var(--p-ink);color:var(--p-paper);border-color:var(--p-ink)}#recipe-phone .ph-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}#recipe-phone .ph-recipe{padding:0;background:var(--p-card);border:1px solid var(--p-line);border-radius:12px;overflow:hidden;display:block;text-align:left;min-width:0}#recipe-phone .ph-art{height:110px;background:var(--food-bg);display:grid;place-items:center;position:relative;overflow:hidden}#recipe-phone .ph-plate{width:91px;height:91px;border-radius:50%;background:#f6ecd6;box-shadow:0 5px 12px #392e242b,inset 0 0 0 6px #e8dcc2;display:grid;place-items:center;transform:rotate(-14deg)}#recipe-phone .ph-dish{width:65px;height:65px;border-radius:50%;background:var(--dish);position:relative}#recipe-phone .ph-dish:after{content:'';position:absolute;inset:11px;background:radial-gradient(ellipse at 25% 25%,#668044 0 12%,transparent 13%),radial-gradient(ellipse at 75% 65%,#597737 0 13%,transparent 14%),radial-gradient(ellipse at 65% 10%,#5c743b 0 10%,transparent 11%)}#recipe-phone .ph-copy{padding:11px 11px 13px}#recipe-phone .ph-category{font-size:8px;text-transform:uppercase;letter-spacing:1px;color:var(--p-tomato)}#recipe-phone h2{font:19px/1.15 'DM Serif Display',Georgia,serif;margin:6px 0 12px}#recipe-phone .ph-meta{font-size:10px;color:var(--p-muted);display:flex;gap:9px;align-items:center;flex-wrap:wrap}#recipe-phone .ph-meta span{display:flex;gap:3px;align-items:center}#recipe-phone .ph-meta svg{width:11px;height:11px}#recipe-phone .ph-banner{margin-top:19px;background:var(--p-sage);border:0;border-radius:10px;display:flex;gap:12px;width:100%;align-items:center;text-align:left;padding:15px;color:var(--p-green);min-height:64px}#recipe-phone .ph-banner svg{width:18px;flex-shrink:0}#recipe-phone .ph-banner strong{display:block;font-size:11px;font-weight:500}#recipe-phone .ph-banner small{display:block;font-size:10px;margin-top:3px}#recipe-phone .ph-bottom{display:flex;background:var(--p-card);border-top:1px solid var(--p-line);padding:11px 10px 18px;justify-content:space-around;gap:5px}#recipe-phone .ph-bottom button{min-height:46px;padding:0 8px;border:0;background:transparent;color:var(--p-muted);display:flex;flex-direction:column;align-items:center;gap:5px;font-size:9px}#recipe-phone .ph-bottom svg{width:19px;height:19px}#recipe-phone .ph-bottom button[aria-pressed="true"]{color:var(--p-tomato)}#recipe-phone .ph-back{padding:0;min-height:44px;background:none;border:0;display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:13px;color:var(--p-muted)}#recipe-phone .ph-back svg{width:15px}#recipe-phone .ph-primary{width:100%;min-height:48px;background:var(--p-tomato);color:var(--p-on);border:0;border-radius:10px;padding:12px 16px;font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px}#recipe-phone .ph-primary svg{width:16px;height:16px}#recipe-phone .ph-secondary{width:100%;min-height:46px;background:var(--p-card);border:1px solid var(--p-line);border-radius:9px;margin-top:10px;font-size:12px}#recipe-phone .ph-steps{font-size:10px;display:flex;align-items:center;gap:9px;padding:22px 0;color:var(--p-muted)}#recipe-phone .ph-steps span:first-child{color:var(--p-tomato)}#recipe-phone .ph-steps i{height:1px;flex:1;background:var(--p-line)}#recipe-phone .ph-field{display:block;font-size:11px;margin:5px 0 8px}#recipe-phone input[type="url"],#recipe-phone textarea{width:100%;background:var(--p-card);color:var(--p-ink);border:1px solid var(--p-line);border-radius:10px;padding:14px 12px;font-size:16px;min-width:0}#recipe-phone textarea{font-size:12px;resize:vertical}#recipe-phone .ph-link-actions{margin-top:12px}#recipe-phone .ph-help{font-size:10px;color:var(--p-muted);margin-top:12px}#recipe-phone .ph-services{display:flex;flex-wrap:wrap;gap:7px;font-size:9px;color:var(--p-muted);margin:18px 0 27px}#recipe-phone .ph-services span{padding:5px 7px;border:1px solid var(--p-line);border-radius:5px}#recipe-phone .ph-divider{border:0;border-top:1px solid var(--p-line);margin:24px 0}#recipe-phone .ph-import-bottom{font-size:13px;font-family:'DM Serif Display',Georgia,serif}#recipe-phone .ph-message{min-height:19px;font-size:11px;color:var(--p-tomato);margin-top:10px}#recipe-phone .ph-scrim{position:absolute;inset:0;background:#25201660;z-index:4;display:flex;align-items:flex-end}#recipe-phone .ph-sheet{width:100%;background:var(--p-card);padding:10px 20px 24px;border-radius:24px 24px 0 0;box-shadow:0 -10px 40px #00000015}#recipe-phone .ph-grip{width:32px;height:4px;border-radius:3px;background:var(--p-line);margin:0 auto 20px}#recipe-phone .ph-sheet-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}#recipe-phone .ph-sheet-heading h2{font-size:26px;margin:0}#recipe-phone .ph-sheet-heading button{background:transparent;border:0;width:44px;height:44px;display:grid;place-items:center;color:var(--p-muted)}#recipe-phone .ph-sheet-heading svg{width:18px;height:18px}#recipe-phone .ph-action{border:0;border-bottom:1px solid var(--p-line);background:transparent;display:flex;align-items:center;width:100%;gap:15px;padding:17px 0;min-height:74px;text-align:left}#recipe-phone .ph-action>span:first-child{background:var(--p-paper);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;color:var(--p-tomato);flex-shrink:0}#recipe-phone .ph-action svg{width:18px;height:18px}#recipe-phone .ph-action strong{display:block;font-size:13px;font-weight:500}#recipe-phone .ph-action small{font-size:10px;color:var(--p-muted)}#recipe-phone .ph-action:last-child{border-bottom:0}#recipe-phone [data-mode="list"] .ph-grid{grid-template-columns:1fr;gap:0}#recipe-phone [data-mode="list"] .ph-recipe{display:flex;align-items:center;gap:14px;border:0;border-bottom:1px solid var(--p-line);border-radius:0;background:transparent;padding:14px 0}#recipe-phone [data-mode="list"] .ph-art{width:69px;height:69px;border-radius:50%;flex-shrink:0}#recipe-phone [data-mode="list"] .ph-plate{width:59px;height:59px;box-shadow:inset 0 0 0 4px #e8dcc2}#recipe-phone [data-mode="list"] .ph-dish{width:42px;height:42px}#recipe-phone [data-mode="list"] .ph-copy{padding:0}#recipe-phone [data-mode="list"] h2{font-size:21px;margin:4px 0 7px}#recipe-phone .ph-review .ph-art{height:145px;border-radius:12px;margin:18px 0}#recipe-phone .ph-review-row{font-size:12px;padding:11px 0;border-bottom:1px solid var(--p-line);display:flex;gap:10px;align-items:center;min-height:44px}#recipe-phone .ph-review ol{padding-left:20px;color:var(--p-muted);font-size:12px}#recipe-phone .ph-review li{padding-bottom:12px}#recipe-phone .ph-review h3{font:23px 'DM Serif Display',Georgia,serif;margin:22px 0 10px}#recipe-phone .ph-review .ph-primary{margin-top:22px}#recipe-phone .ph-servings{display:flex;align-items:center;justify-content:space-between;margin:20px 0}#recipe-phone .ph-servings>span{font-size:12px}#recipe-phone .ph-serving-control{display:flex;gap:14px;align-items:center}#recipe-phone .ph-serving-control button{width:44px;height:44px;background:var(--p-card);border:1px solid var(--p-line);border-radius:50%}#recipe-phone .ph-cooking-step{font:27px/1.4 'DM Serif Display',Georgia,serif;margin:25px 0 35px;color:var(--p-ink)}
@media(max-width:360px){#recipe-phone .ph-stage{padding:12px 0;min-height:900px}#recipe-phone .ph-app{border-radius:18px}#recipe-phone .ph-main{padding:20px 14px;min-height:650px}#recipe-phone .ph-grid{gap:10px}#recipe-phone .ph-art{height:95px}#recipe-phone h2{font-size:18px}#recipe-phone .ph-tabs{gap:6px}#recipe-phone .ph-tabs button{padding:10px 11px}#recipe-phone .ph-bottom button{padding:0 5px}}
</style>
<script>
(()=>{
const root=document.getElementById('recipe-phone');
const dishes=[{name:'Roasted tomato pasta',type:'Weeknight favourite',min:25,bg:'#c9ac8b',dish:'repeating-radial-gradient(ellipse at 40% 45%,#d99a51 0 3px,#b95633 4px 6px,#e2bb76 7px 9px)'},{name:'Crispy sesame gyoza',type:'Something to share',min:40,bg:'#b2b89f',dish:'repeating-conic-gradient(#e9d6a7 0deg 25deg,#b78c4e 26deg 30deg,#e9d6a7 31deg 50deg,#53663a 51deg 60deg)'},{name:'Lemony chickpea bowl',type:'Lunch, sorted',min:20,bg:'#decca7',dish:'repeating-radial-gradient(circle at 60% 50%,#e0c17a 0 4px,#b79b57 5px 6px,#ead99b 7px 10px)'},{name:'Sunday tiramisu',type:'A sweet ending',min:35,bg:'#c5afa2',dish:'repeating-linear-gradient(0deg,#79523e 0 8px,#dec29b 9px 14px,#eee0c8 15px 20px)'}];
const art=r=>`<div class="ph-art" style="--food-bg:${r.bg};--dish:${r.dish}"><div class="ph-plate"><div class="ph-dish"></div></div></div>`;
const icons=()=>{if(globalThis.lucide)lucide.createIcons();};
root.querySelectorAll('.ph-app').forEach(app=>{
let view='recipes',filter='All recipes',servings=2,cookStep=0;
const steps=['Roast the tomatoes and garlic with olive oil at 200°C for 20 minutes.','Cook the pasta in salted water. Reserve a cup of cooking water.','Toss everything together with basil and a splash of pasta water.'];
app.innerHTML=`<header class="ph-top"><span class="ph-brand">myrecipes<span>.</span></span><button class="ph-icon" data-add aria-label="Add to your cookbook"><i data-lucide="plus" aria-hidden="true"></i></button></header><main class="ph-main"></main><nav class="ph-bottom" aria-label="Main navigation"><button data-nav="home"><i data-lucide="house" aria-hidden="true"></i>Home</button><button data-nav="recipes" aria-pressed="true"><i data-lucide="book-open" aria-hidden="true"></i>Recipes</button><button data-nav="shopping"><i data-lucide="shopping-basket" aria-hidden="true"></i>Shopping</button><button data-nav="planning"><i data-lucide="calendar-days" aria-hidden="true"></i>Plan</button></nav><div class="ph-scrim" hidden><section class="ph-sheet" role="dialog" aria-modal="true" aria-label="Add to your cookbook"><div class="ph-grip"></div><div class="ph-sheet-heading"><h2>A new addition.</h2><button data-close aria-label="Close menu"><i data-lucide="x" aria-hidden="true"></i></button></div><button class="ph-action" data-write><span><i data-lucide="pencil-line" aria-hidden="true"></i></span><span><strong>Write a recipe</strong><small>Your own tried-and-tested keeper</small></span></button><button class="ph-action" data-import><span><i data-lucide="link" aria-hidden="true"></i></span><span><strong>Import a recipe</strong><small>From a website, pin or video</small></span></button><button class="ph-action" data-log><span><i data-lucide="notebook-pen" aria-hidden="true"></i></span><span><strong>Log a cook</strong><small>Remember what you made</small></span></button></section></div>`;
const main=app.querySelector('.ph-main'),scrim=app.querySelector('.ph-scrim');
const back='<button class="ph-back" data-back><i data-lucide="arrow-left" aria-hidden="true"></i> My recipes</button>';
const message=text=>{let el=main.querySelector('.ph-message');if(!el){el=document.createElement('p');el.className='ph-message';el.setAttribute('role','status');main.appendChild(el);}el.textContent=text;};
const remember=()=>{if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{design:app.dataset.mode,screen:view},privateContent:null}).catch(()=>{});};
const ingredientRows=()=>[`${200*servings/2} g pasta`,`${400*servings/2} g cherry tomatoes`,`${2*servings/2} tbsp olive oil`,`${2*servings/2} cloves garlic`,'Basil, salt & pepper'].map(t=>`<label class="ph-review-row"><input type="checkbox">${t}</label>`).join('');
function render(){
scrim.hidden=true;app.querySelectorAll('.ph-bottom button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.nav===(['detail','import','review','cook'].includes(view)?'recipes':view))));
if(view==='recipes'||view==='home')main.innerHTML=`<span class="ph-kicker">${app.dataset.mode==='cards'?'COLLECTED, COOKED, LOVED':'YOUR POCKET NOTEBOOK'}</span><h1>${app.dataset.mode==='cards'?'Your recipe book.':'What sounds good?'}</h1><p class="ph-sub">Good things worth making again.</p><div class="ph-tabs" aria-label="Recipe filter">${['All recipes','Quick meals','Favourites'].map(t=>`<button data-filter="${t}" aria-pressed="${filter===t}">${t}</button>`).join('')}</div><div class="ph-grid">${dishes.map((r,i)=>({r,i})).filter(({r,i})=>filter==='All recipes'||(filter==='Quick meals'?r.min<=25:i===0||i===3)).map(({r,i})=>`<button class="ph-recipe" data-recipe="${i}">${art(r)}<div class="ph-copy"><span class="ph-category">${r.type}</span><h2>${r.name}</h2><div class="ph-meta"><span><i data-lucide="clock-3" aria-hidden="true"></i>${r.min} min</span><span>2 servings</span></div></div></button>`).join('')}</div><button class="ph-banner" data-import><i data-lucide="link" aria-hidden="true"></i><span><strong>Found something delicious?</strong><small>Import a website, pin or video ↗</small></span></button>`;
else if(view==='import')main.innerHTML=`${back}<span class="ph-kicker">FROM SOMEWHERE GOOD</span><h1>A new page<br>in your book.</h1><p class="ph-sub">That recipe you saved or sent to yourself.<br>Let’s give it a proper home.</p><div class="ph-steps"><span>1. Add a link</span><i></i><span>2. Extract</span><i></i><span>3. Review</span></div><label class="ph-field" for="ph-link-${app.dataset.mode}">Recipe or video link</label><input type="url" id="ph-link-${app.dataset.mode}" placeholder="Paste a link here…"><div class="ph-link-actions"><button class="ph-primary" data-prompt>Create recipe prompt <i data-lucide="arrow-up-right" aria-hidden="true"></i></button></div><p class="ph-help">Use the prompt in Codex or ChatGPT to extract your recipe.</p><div class="ph-services"><span>Websites</span><span>Instagram</span><span>Pinterest</span><span>Videos</span></div><hr class="ph-divider"><span class="ph-import-bottom">Already have the recipe?</span><button class="ph-secondary" data-paste>Paste recipe or upload file</button><button class="ph-secondary" data-sample>Try the sample preview</button><p class="ph-help">Design preview · No recipes will be saved.</p><p class="ph-message" role="status"></p>`;
else if(view==='detail'||view==='review')main.innerHTML=`${back}<div class="ph-review"><span class="ph-kicker">${view==='review'?'SAMPLE RECIPE · REVIEW BEFORE SAVING':'WEEKNIGHT FAVOURITE'}</span><h1>Roasted tomato pasta</h1><div class="ph-meta">25 minutes · Simple ingredients</div>${art(dishes[0])}<div class="ph-servings"><span>Servings</span><div class="ph-serving-control"><button data-minus aria-label="Fewer servings">−</button><span class="ph-count">${servings}</span><button data-plus aria-label="More servings">+</button></div></div>${view==='detail'?'<button class="ph-primary" data-cook><i data-lucide="play" aria-hidden="true"></i> Start cooking</button>':''}<h3>Ingredients</h3><div class="ph-ingredients">${ingredientRows()}</div><h3>Method</h3><ol>${steps.map(s=>`<li>${s}</li>`).join('')}</ol>${view==='review'?'<button class="ph-primary" data-save>Add to my recipe book <i data-lucide="check" aria-hidden="true"></i></button><p class="ph-help">Preview only · Nothing will be saved</p>':''}</div>`;
else if(view==='cook')main.innerHTML=`<button class="ph-back" data-detail><i data-lucide="arrow-left" aria-hidden="true"></i> Back to recipe</button><span class="ph-kicker">ROASTED TOMATO PASTA</span><h1>Let’s get cooking.</h1><p class="ph-help">Step ${cookStep+1} of 3</p><div class="ph-cooking-step">${steps[cookStep]}</div><button class="ph-primary" data-next>${cookStep===2?'Finish cooking':'Next step'} <i data-lucide="arrow-right" aria-hidden="true"></i></button>${cookStep>0?'<button class="ph-secondary" data-previous>Previous step</button>':''}`;
else main.innerHTML=`${back}<span class="ph-kicker">YOUR KITCHEN</span><h1>${view==='shopping'?'Shopping list.':'A week of good food.'}</h1><p class="ph-sub">This preview focuses on recipes and importing.</p>`;
icons();}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(e.target===scrim){scrim.hidden=true;return;}if(!b)return;
if(b.hasAttribute('data-add')){scrim.hidden=false;app.querySelector('.ph-sheet [data-close]').focus();}
if(b.hasAttribute('data-close')){scrim.hidden=true;app.querySelector('[data-add]').focus();}
if(b.hasAttribute('data-import')){view='import';render();remember();}
if(b.dataset.nav){view=b.dataset.nav;render();remember();}
if(b.hasAttribute('data-back')){view='recipes';render();remember();}
if(b.dataset.filter){filter=b.dataset.filter;render();}
if(b.hasAttribute('data-recipe')){if(b.dataset.recipe==='0'){view='detail';servings=2;render();remember();}else message('Tap Roasted tomato pasta to explore the recipe layout.');}
if(b.hasAttribute('data-write')||b.hasAttribute('data-log')){scrim.hidden=true;message(b.hasAttribute('data-write')?'Your existing recipe editor would open here.':'Your existing cooking log would open here.');}
if(b.hasAttribute('data-prompt')){const input=main.querySelector('input[type="url"]');try{const url=new URL(input.value);if(!['http:','https:'].includes(url.protocol))throw Error();message('Prompt prepared. In the app, copy it into your chat, then bring the recipe back here.');}catch{message('Paste a website or video link first.');input.focus();}}
if(b.hasAttribute('data-paste')){b.outerHTML='<label class="ph-field">Recipe template<textarea rows="5" placeholder="Paste the completed recipe template…"></textarea></label><button class="ph-primary" data-sample>Preview sample recipe</button>';}
if(b.hasAttribute('data-sample')){view='review';servings=2;render();remember();}
if(b.hasAttribute('data-save')){b.textContent='Recipe reviewed ✓';b.disabled=true;message('Preview complete. Nothing has been saved.');}
if(b.hasAttribute('data-plus')||b.hasAttribute('data-minus')){servings=Math.max(1,servings+(b.hasAttribute('data-plus')?1:-1));main.querySelector('.ph-count').textContent=servings;main.querySelector('.ph-ingredients').innerHTML=ingredientRows();}
if(b.hasAttribute('data-cook')){view='cook';cookStep=0;render();}
if(b.hasAttribute('data-next')){if(cookStep<2){cookStep++;render();}else{view='detail';render();message('All done. Enjoy your meal!');}}
if(b.hasAttribute('data-previous')){cookStep--;render();}
if(b.hasAttribute('data-detail')){view='detail';render();}
});
app.addEventListener('keydown',e=>{if(e.key==='Escape'&&!scrim.hidden){scrim.hidden=true;app.querySelector('[data-add]').focus();}});
render();
const settings={corners:12};if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:()=>app.querySelectorAll('.ph-recipe').forEach(c=>c.style.borderRadius=settings.corners+'px')});tweak.addSlider(settings,'corners',{label:'Recipe card corners',min:0,max:22,unit:'px'});}
});
})();
</script>
