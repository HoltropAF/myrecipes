rder-top:1px solid var(--ms-line);padding:12px 8px 17px;margin-top:auto}#meal-style-options .ms-nav button{min-width:44px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:transparent;font:9px 'JetBrains Mono',monospace;color:var(--ms-muted)}#meal-style-options .ms-nav svg{width:19px;height:19px}#meal-style-options .ms-nav .ms-home{border-radius:50%;background:var(--ms-tomato);color:var(--ms-on);width:54px;height:54px;margin-top:-31px;border:4px solid var(--ms-panel);display:grid;place-items:center;box-shadow:0 0 0 1px var(--ms-line)}#meal-style-options .ms-nav .ms-home svg{width:29px;height:29px}#meal-style-options .ms-nav .ms-selected{color:var(--ms-deep)}#meal-style-options .ms-message{font:11px/1.5 Karla,sans-serif;color:var(--ms-sage);margin:12px 0 0;min-height:0}#meal-style-options .ms-message:empty{display:none}

<script>
(()=>{
const root=document.getElementById('meal-style-options');
const initial=[{name:'Gyoza',kind:'cook'},{name:'Gyoza',kind:'leftover'},{name:'Chili con carne',kind:'cook'},{name:'Chili con carne',kind:'leftover'},{name:'Eating out with friends',kind:'out'},{name:'',kind:'empty'},{name:'',kind:'empty'}];
const weekdays=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const icons=()=>{if(globalThis.lucide)lucide.createIcons();};
root.querySelectorAll('.ms-phone').forEach(phone=>{
const style=phone.dataset.style;let meals=initial.map(m=>({...m})),focus=0,editing=0;
const kindLabel=k=>({cook:'COOK · MAKE EXTRA',leftover:'LEFTOVERS · NO COOKING',out:'EATING OUT',empty:'NOT PLANNED'})[k];
const iconFor=k=>({cook:'cooking-pot',leftover:'refrigerator',out:'utensils',empty:'plus'})[k];
const entry=(meal,i)=>`<div class="ms-row"><div class="ms-date">${weekdays[i]}<b>${19+i}</b></div><button class="ms-entry cursor-interaction ${meal.kind==='empty'?'ms-empty':''}" data-edit="${i}"><span><strong>${meal.name||'Nothing planned yet'}</strong>${meal.kind!=='empty'?`<small class="ms-tag-${meal.kind}">${kindLabel(meal.kind)}</small>`:''}</span><i data-lucide="${meal.kind==='empty'?'plus':'chevron-right'}" aria-hidden="true"></i></button></div>`;
const folds=()=>`<details class="ms-fold"><summary>Waiting to be planned <span>4</span></summary><button class="cursor-interaction" data-pick="Caprese salad">Caprese salad <span>Plan →</span></button><button class="cursor-interaction" data-pick="Mushroom noodles">Mushroom noodles <span>Plan →</span></button></details><details class="ms-fold"><summary>Inspiration & favourites</summary><button class="cursor-interaction" data-pick="Crispy sesame gyoza">Crispy sesame gyoza <span>Plan →</span></button><button class="cursor-interaction" data-pick="Sunday tiramisu">Sunday tiramisu <span>Plan →</span></button></details>`;
const inbox=()=>`<details class="ms-inbox"><summary class="cursor-interaction"><i data-lucide="shopping-basket" aria-hidden="true"></i><span><strong>From your shopping list</strong><small>2 recipes ready to plan</small></span></summary><button class="cursor-interaction" data-pick="Caprese salad">Caprese salad <span>Plan →</span></button><button class="cursor-interaction" data-pick="Bao buns">Bao buns <span>Plan →</span></button></details>`;
const actions=()=>`<div class="ms-actions"><button class="cursor-interaction" data-add="recipe"><i data-lucide="plus" aria-hidden="true"></i>Add a recipe</button><button class="cursor-interaction" data-add="out"><i data-lucide="utensils" aria-hidden="true"></i>Other plan</button></div>`;
const nav=`<nav class="ms-nav" aria-label="App navigation"><button class="cursor-interaction" data-nav="Recipes"><i data-lucide="bookmark" aria-hidden="true"></i>Recipes</button><button class="cursor-interaction" data-nav="Shopping"><i data-lucide="list-checks" aria-hidden="true"></i>List</button><button class="ms-home cursor-interaction" data-nav="Home" aria-label="Home"><i data-lucide="compass" aria-hidden="true"></i></button><button class="ms-selected cursor-interaction" data-nav="Meal prep"><i data-lucide="calendar-days" aria-hidden="true"></i>Meal prep</button><button class="cursor-interaction" data-nav="Settings"><i data-lucide="settings" aria-hidden="true"></i>Settings</button></nav>`;
function render(){
let content='';
const week='<div class="ms-week"><button class="cursor-interaction" data-week="previous" aria-label="Previous week"><i data-lucide="chevron-left" aria-hidden="true"></i></button><span>19–25 OCTOBER</span><button class="cursor-interaction" data-week="next" aria-label="Next week"><i data-lucide="chevron-right" aria-hidden="true"></i></button></div>';
if(style==='notebook')content=`<span class="ms-eyebrow">A week in your kitchen</span><h1>On the menu.</h1><p class="ms-subtitle">Cook a little. Enjoy it a little longer.</p>${week}${actions()}${inbox()}<div class="ms-section-label">Next week <span>October</span></div><div class="ms-agenda">${meals.map(entry).join('')}</div>${folds()}`;
if(style==='daily')content=`<div class="ms-daily-hero"><span class="ms-eyebrow">Meal prep · 19–25 October</span><h1>One day at a time.</h1><p class="ms-subtitle">A small plan. A calmer week.</p><div class="ms-daystrip" aria-label="Choose a day">${weekdays.map((d,i)=>`<button class="cursor-interaction" data-focus="${i}" aria-pressed="${i===focus}">${d.slice(0,1)}<b>${19+i}</b></button>`).join('')}</div></div>${actions()}<div class="ms-section-label">${weekdays[focus]} ${19+focus} October</div><div class="ms-focus-card"><div class="ms-focus-top"><span>${kindLabel(meals[focus].kind)}</span><i data-lucide="${iconFor(meals[focus].kind)}" aria-hidden="true"></i></div><h2>${meals[focus].name||'A little room for something good.'}</h2><p>${meals[focus].kind==='cook'?'Make enough for tomorrow, too.':meals[focus].kind==='leftover'?'Dinner is already taken care of.':meals[focus].kind==='out'?'A night away from the kitchen.':'Choose a recipe or add another plan.'}</p><button class="cursor-interaction" data-edit="${focus}">${meals[focus].kind==='empty'?'Plan this day':'Change this plan'}</button></div><details class="ms-fold"><summary>The rest of your week <span>${meals.filter(m=>m.kind!=='empty').length} planned days</span></summary>${meals.map(entry).join('')}</details>${inbox()}${folds()}`;
if(style==='cards')content=`<span class="ms-eyebrow">Make room for good food</span><h1>Your week, sorted.</h1><p class="ms-subtitle">The whole week at a glance.</p>${week}${actions()}<div class="ms-cardgrid">${meals.map((m,i)=>`<button class="ms-daycard cursor-interaction ${m.kind==='leftover'?'ms-leftover':''} ${m.kind==='empty'?'ms-empty':''}" data-edit="${i}"><small>${weekdays[i].toUpperCase()} ${19+i}</small><strong>${m.name||'Add a plan'}</strong><span>${m.kind==='cook'?'COOK + SAVE EXTRA':m.kind==='leftover'?'LEFTOVERS':m.kind==='out'?'EATING OUT':'＋'}</span></button>`).join('')}</div>${inbox()}${folds()}`;
phone.innerHTML=`<header class="ms-brand"><span>myrecipes.</span><small>YOUR KITCHEN</small></header><main class="ms-main">${content}<p class="ms-message" role="status" aria-live="polite"></p></main>${nav}<div class="ms-overlay" hidden><section class="ms-editor" role="dialog" aria-modal="true" aria-label="Edit meal plan"></section></div>`;icons();
}
function edit(index,picked,kind){editing=index;const meal=meals[index];const overlay=phone.querySelector('.ms-overlay');const editor=phone.querySelector('.ms-editor');editor.innerHTML=`<h2>Make a little plan.</h2><p>Sample preview · ${weekdays[index]} ${19+index} October</p><label>Day<select data-edit-day>${weekdays.map((d,i)=>`<option value="${i}" ${i===index?'selected':''}>${d} ${19+i} October</option>`).join('')}</select></label><label>Plan type<select data-edit-kind><option value="cook">Cook a recipe</option><option value="leftover">Leftovers</option><option value="out">Eating out / other plan</option><option value="empty">Nothing planned</option></select></label><label>Recipe or plan<input data-edit-name aria-label="Recipe or plan" maxlength="100"></label><div class="ms-editor-buttons"><button class="cursor-interaction" data-cancel>Cancel</button><button class="cursor-interaction" data-save>Save plan</button></div>`;editor.querySelector('[data-edit-kind]').value=kind||meal.kind==='empty'?'cook':meal.kind;if(kind)editor.querySelector('[data-edit-kind]').value=kind;editor.querySelector('[data-edit-name]').value=picked||meal.name;overlay.hidden=false;}
function saveState(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{mealPrepStyle:style},privateContent:{focus,meals}}).catch(()=>{});}
phone.addEventListener('click',e=>{const b=e.target.closest('button');if(e.target.classList.contains('ms-overlay')){e.target.hidden=true;return;}if(!b)return;
if(b.hasAttribute('data-focus')){focus=Number(b.dataset.focus);render();saveState();}
if(b.hasAttribute('data-edit'))edit(Number(b.dataset.edit));
if(b.hasAttribute('data-add'))edit(focus,b.dataset.add==='out'?'Eating out':'',b.dataset.add==='out'?'out':'cook');
if(b.hasAttribute('data-pick'))edit(meals.findIndex(m=>m.kind==='empty')<0?0:meals.findIndex(m=>m.kind==='empty'),b.dataset.pick,'cook');
if(b.hasAttribute('data-cancel'))phone.querySelector('.ms-overlay').hidden=true;
if(b.hasAttribute('data-save')){const editor=phone.querySelector('.ms-editor'),index=Number(editor.querySelector('[data-edit-day]').value),kind=editor.querySelector('[data-edit-kind]').value,name=editor.querySelector('[data-edit-name]').value.trim();if(kind!=='empty'&&!name){editor.querySelector('[data-edit-name]').focus();return;}meals[index]={name:kind==='empty'?'':name,kind};focus=index;render();saveState();}
if(b.hasAttribute('data-nav'))phone.querySelector('.ms-message').textContent='Styling preview · '+b.dataset.nav+' navigation stays as in your app.';
if(b.hasAttribute('data-week'))phone.querySelector('.ms-message').textContent='Styling preview uses the sample week of 19–25 October.';
});
phone.addEventListener('keydown',e=>{if(e.key==='Escape')phone.querySelector('.ms-overlay').hidden=true;});
render();
const saved=window.openai?.widgetState;if(saved?.modelContent?.mealPrepStyle===style&&Array.isArray(saved.privateContent?.meals)&&saved.privateContent.meals.length===7){meals=saved.privateContent.meals;focus=Math.max(0,Math.min(6,saved.privateContent.focus||0));render();}
if(globalThis.Tweak){const settings={rounding:13};const tweak=new Tweak({container:phone,onChange:()=>phone.style.setProperty('--ms-radius',settings.rounding+'px')});tweak.addSlider(settings,'rounding',{label:'Panel corners',min:0,max:24,unit:'px'});}
});
})();
</script>
